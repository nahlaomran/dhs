# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Nahla Omran | Data and Human Space
email: no2312@nyu.edu
description: >- # this means to ignore newlines until "baseurl:"
  NYUAD student exploring how data, design, and human experience shape the spaces we live in.
url: "https://nahlaomran.github.io"
baseurl: "/dhs"
twitter_username: nahlaomran
github_username: nahlaomran
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Nahla Omran"
  avatar : "/assets/images/image.png"
  bio    : "Student in Data and Human Space interested in the intersection of civic life, digital systems, and human experience."
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://example.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nahlaomran"

footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/nahlaomran"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/nahlaomran"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:no2312@nyu.edu"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
